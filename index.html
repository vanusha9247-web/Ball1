<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy 33rd Birthday!</title>
    <style>
        :root {
            --gold: #ffd700;
            --lego-blue: #0055ad;
            --lego-red: #e60012;
        }

        body {
            margin: 0; padding: 0;
            background: #0b0d17;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
            text-align: center;
        }

        /* Animated Star Background */
        .stars {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1; background: radial-gradient(ellipse at bottom, #1B2735 0%, #090A0F 100%);
        }

        #overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 1000;
        }

        .hidden { display: none !important; }

        /* Balloon Animation */
        .balloon {
            width: 75px; height: 95px; border-radius: 50%;
            position: absolute; bottom: -150px; cursor: pointer;
            display: flex; justify-content: center; align-items: center;
            font-weight: bold; font-size: 24px; color: white;
            box-shadow: inset -8px -8px 15px rgba(0,0,0,0.3);
            transition: transform 0.2s;
        }
        .balloon:hover { transform: scale(1.1); }

        /* Lego Cake Styling */
        .cake-container { margin: 20px auto; width: 200px; display: none; }
        .lego-brick {
            height: 35px; margin: 2px auto; border-radius: 4px;
            border-bottom: 4px solid rgba(0,0,0,0.3);
        }
        .candle {
            width: 12px; height: 35px; background: #eee;
            display: inline-block; margin: 0 5px; position: relative; cursor: pointer;
        }
        .flame {
            width: 12px; height: 18px; background: orange;
            border-radius: 50% 50% 20% 20%; position: absolute; top: -18px;
            animation: flicker 0.1s infinite; box-shadow: 0 0 10px orange;
        }

        /* Scratch Cards */
        .scratch-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px; padding: 20px; max-width: 900px; margin: 0 auto;
        }
        .card {
            position: relative; width: 250px; height: 130px;
            background: #fff; color: #222; border-radius: 15px;
            display: flex; justify-content: center; align-items: center;
            padding: 15px; font-style: italic; font-weight: bold; margin: auto;
        }
        canvas { position: absolute; top: 0; left: 0; border-radius: 15px; cursor: crosshair; }

        .anime-character { width: 180px; filter: drop-shadow(0 0 10px var(--gold)); }

        @keyframes flicker {
            0%, 100% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.2); opacity: 1; }
        }

        h1 { font-size: 2.5rem; text-shadow: 0 0 20px var(--gold); }
    </style>
</head>
<body>

    <div class="stars"></div>

    <div id="overlay">
        <h1 style="color: var(--gold);">Waiting for Midnight...</h1>
        <div id="countdown" style="font-size: 3rem; margin: 20px;">00:00:00</div>
        <p>A 33rd Birthday surprise is waiting for you!</p>
    </div>

    <div id="main-content" class="hidden">
        <h1 id="title">Happy 33rd Birthday, Handsome! ❤️</h1>
        <p id="instruction">Pop all 6 balloons to see your surprise!</p>
        
        <div id="balloon-zone"></div>

        <div id="cake-milestone" class="cake-container">
            <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExNHJueGZ3bmZ3bmZ3bmZ3JmVwPXYxX2ludGVybmFsX2dpZl9ieV9pZCZjdD1n/118pWdVnSslbG0/giphy.gif" class="anime-character">
            <div style="margin-top: 10px;">
                <div class="candle" onclick="blow(this)"><div class="flame"></div></div>
                <div class="candle" onclick="blow(this)"><div class="flame"></div></div>
                <div class="candle" onclick="blow(this)"><div class="flame"></div></div>
            </div>
            <div class="lego-brick" style="width: 80px; background: var(--lego-red);"></div>
            <div class="lego-brick" style="width: 130px; background: #f5cf16;"></div>
            <div class="lego-brick" style="width: 180px; background: var(--lego-blue);"></div>
            <p>Click the flames to make a wish!</p>
        </div>

        <div id="final-section" class="hidden">
            <h2 style="color: var(--gold);">Scratch for a Heartfelt Message...</h2>
            <div class="scratch-grid" id="grid"></div>
        </div>
    </div>

    <script>
        const msgs = [
            "In your arms, I’ve found my forever home. I love you so much.",
            "33 years ago the world got brighter, and I'm the luckiest to have you.",
            "You are the best thing that ever happened to me. Happy Birthday, my love.",
            "To the man who works so hard for us—you are my inspiration every day.",
            "Thank you for being my rock, my best friend, and my soulmate.",
            "Every day with you is a gift. Here is to a lifetime more. ❤️"
        ];

        let count = 0;

        function start() {
            const now = new Date();
            // Set to 'true' to test immediately. Set to 'now.getHours() === 0' for actual midnight.
            if (true) {
                document.getElementById('overlay').classList.add('hidden');
                document.getElementById('main-content').classList.remove('hidden');
                addBalloon();
            } else {
                document.getElementById('countdown').innerText = now.toLocaleTimeString();
                setTimeout(start, 1000);
            }
        }

        function addBalloon() {
            if (count < 6) {
                const b = document.createElement('div');
                b.className = 'balloon';
                b.innerText = count + 1;
                b.style.left = (15 + Math.random() * 70) + '%';
                b.style.backgroundColor = `hsl(${Math.random() * 360}, 70%, 50%)`;
                document.getElementById('balloon-zone').appendChild(b);
                
                let y = -150;
                const move = setInterval(() => {
                    if (y > window.innerHeight) { b.remove(); clearInterval(move); addBalloon(); }
                    else { y += 3; b.style.bottom = y + 'px'; }
                }, 20);

                b.onclick = () => {
                    b.remove(); clearInterval(move);
                    count++;
                    if (count === 6) showCake(); else addBalloon();
                };
            }
        }

        function showCake() {
            document.getElementById('instruction').innerText = "YAY! You found the cake!";
            document.getElementById('cake-milestone').style.display = 'block';
        }

        function blow(c) {
            const f = c.querySelector('.flame');
            if(f) {
                f.remove();
                if(document.querySelectorAll('.flame').length === 0) {
                    setTimeout(() => {
                        document.getElementById('cake-milestone').style.display = 'none';
                        document.getElementById('final-section').classList.remove('hidden');
                        initScratch();
                    }, 800);
                }
            }
        }

        function initScratch() {
            const grid = document.getElementById('grid');
            msgs.forEach(m => {
                const div = document.createElement('div');
                div.className = 'card';
                div.innerHTML = `<span>${m}</span>`;
                const can = document.createElement('canvas');
                can.width = 250; can.height = 130;
                const ctx = can.getContext('2d');
                ctx.fillStyle = '#b7b7b7';
                ctx.fillRect(0, 0, 250, 130);
                
                const draw = (e) => {
                    const r = can.getBoundingClientRect();
                    const x = (e.clientX || (e.touches ? e.touches[0].clientX : 0)) - r.left;
                    const y = (e.clientY || (e.touches ? e.touches[0].clientY : 0)) - r.top;
                    ctx.globalCompositeOperation = 'destination-out';
                    ctx.beginPath(); ctx.arc(x, y, 20, 0, Math.PI*2); ctx.fill();
                };
                can.addEventListener('mousemove', (e) => { if(e.buttons===1) draw(e); });
                can.addEventListener('touchmove', (e) => { e.preventDefault(); draw(e); });
                div.appendChild(can);
                grid.appendChild(div);
            });
        }

        window.onload = start;
    </script>
</body>
</html>
